services:
  mongo:
    ports: !reset []

  app:
    ports: !reset []
    environment:
      APP_ENV: production
    networks:
      default:
      web:
    labels:
      # List form (not a mapping) so ${FITTRACKER_BASIC_AUTH_USER} gets
      # interpolated - compose does not substitute variables in YAML keys.
      - "caddy=${FITTRACKER_DOMAIN}"
      - "caddy.basic_auth="
      - "caddy.basic_auth.${FITTRACKER_BASIC_AUTH_USER}=${FITTRACKER_BASIC_AUTH_HASH}"
      - "caddy.reverse_proxy={{upstreams 8080}}"

# Reverse-proxied by the shared Caddy in the sibling `caddy-docker-proxy` repo, which
# discovers this service via the labels above - see that repo for setup.
networks:
  web:
    external: true
