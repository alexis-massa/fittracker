services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Only started for local dev (see COMPOSE_PROFILES in .env.example) -
    # production points DATABASE_URL at a shared instance instead.
    profiles:
      - dev
    environment:
      POSTGRES_DB: fittracker
      POSTGRES_USER: fittracker
      POSTGRES_PASSWORD: fittracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Non-default host port so this doesn't clash with another project's
      # local Postgres (e.g. territoride) running at the same time.
      - "5433:5432"

  app:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override just the host so this works out of the box in Compose -
      # .env's DATABASE_URL stays "localhost" for running main.py directly.
      DATABASE_URL: postgresql://fittracker:fittracker@db:5432/fittracker
    depends_on:
      - db

volumes:
  pgdata:
