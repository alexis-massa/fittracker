services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override just the host so this works out of the box in Compose -
      # .env's MONGO_URI stays "localhost" for running main.py directly.
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

volumes:
  mongodata:
